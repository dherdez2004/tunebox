<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tunebox">
<meta name="description" content="Tunebox — your free music app">
<title>Tunebox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#0b0b10; --panel:#15151d; --panel2:#1e1e28; --line:#2a2a36; --hover:#24242f;
  --ink:#f4f4f7; --ink2:#b4b4c2; --ink3:#7d7d8e;
  --acc:#ff3d6e; --acc2:#ff8a3d; --good:#3ddc97;
  --r:14px; --mini:76px; --tabs:64px;
  --sa-b:env(safe-area-inset-bottom,0px); --sa-t:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:var(--ink)}
svg{display:block}
.hide{display:none!important}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 340px;height:100%}
.side{background:#07070b;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px;letter-spacing:-.02em;padding:0 10px 20px}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.logo i svg{width:18px;height:18px;color:#fff}
.nav{display:flex;align-items:center;gap:14px;padding:12px 12px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:16px;text-decoration:none}
.nav svg{width:24px;height:24px}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.on{background:var(--panel2);color:var(--ink)}
.nav.on svg{color:var(--acc)}
.side .install{margin-top:auto}
.side .install .btn{width:100%;padding:0 12px;font-size:15px}
.main{overflow:auto;position:relative}
.view{padding:28px 32px 60px;max-width:1100px}
.np-panel{background:#07070b;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.np-panel .inner{padding:20px 16px;overflow:auto;flex:1}
.slot{width:100%;aspect-ratio:1/1;border-radius:14px;background:var(--panel);overflow:hidden;position:relative;display:grid;place-items:center}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .ph{color:var(--ink3);text-align:center;padding:20px;font-size:14px}
#ytWrap{position:fixed;z-index:35;background:#000;border-radius:12px;overflow:hidden;display:none}
#ytWrap iframe,#ytWrap #ytPlayer{width:100%;height:100%;border:0;display:block}
.tabs{display:none}
.mini{display:none}
/* ---------- type & common ---------- */
h1{font-size:32px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:800}
h2{font-size:21px;margin:30px 0 12px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:12px}
h2 .see{margin-left:auto;font-size:15px;color:var(--ink2);font-weight:600}
.sub{color:var(--ink2);margin:6px 0 0;font-size:15px}
.muted{color:var(--ink3)}
.head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.back{width:44px;height:44px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;flex:none}
.back svg{width:24px;height:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;background:var(--panel2);font-weight:700;font-size:16px;border:1px solid var(--line);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.big{min-height:56px;padding:0 28px;font-size:17px}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg{width:22px;height:22px}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{min-height:44px;padding:0 18px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:650;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hello{background:linear-gradient(135deg,rgba(255,61,110,.18),rgba(255,138,61,.12));border:1px solid rgba(255,61,110,.35);border-radius:18px;padding:20px;margin-bottom:22px}
.hello h3{margin:0 0 8px;font-size:20px}
.hello ol{margin:0 0 14px;padding-left:22px;color:var(--ink2)}
.hello li{margin:4px 0}
.hello b{color:var(--ink)}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);border:2px dashed var(--line);border-radius:18px}
.empty h3{color:var(--ink);margin:0 0 6px;font-size:20px}
.empty .row{justify-content:center;margin-top:16px}
/* search box */
.sbox{position:relative}
.sbox input{width:100%;height:58px;border-radius:16px;border:2px solid var(--line);background:var(--panel);padding:0 52px 0 54px;font-size:18px;outline:none}
.sbox input:focus{border-color:var(--acc)}
.sbox>svg{position:absolute;left:18px;top:17px;width:24px;height:24px;color:var(--ink3)}
.sbox .clr{position:absolute;right:10px;top:9px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.sbox .clr svg{width:22px;height:22px}
/* mix card */
.mix{display:flex;align-items:center;gap:18px;padding:20px;border-radius:20px;background:linear-gradient(120deg,#3b1530,#1f1430 60%,#151520);border:1px solid #4a2040;width:100%;text-align:left}
.mix .ic{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;flex:none}
.mix .ic svg{width:36px;height:36px;color:#fff}
.mix b{display:block;font-size:21px}
.mix span{color:var(--ink2);font-size:15px}
.mix .go{margin-left:auto;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.mix .go svg{width:26px;height:26px}
/* song rows */
.list{display:flex;flex-direction:column;gap:2px}
.song{display:flex;align-items:center;gap:14px;padding:8px;border-radius:12px;cursor:pointer;min-height:72px}
.song:hover{background:var(--hover)}
.song.now{background:rgba(255,61,110,.1)}
.song.now .t{color:var(--acc)}
.song .num{width:24px;text-align:right;color:var(--ink3);font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.art{width:56px;height:56px;border-radius:10px;flex:none;background:var(--panel2);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:20px;color:rgba(255,255,255,.85)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.song .txt{flex:1;min-width:0}
.song .t{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song .why{color:var(--ink3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.ib:hover{background:var(--panel2);color:var(--ink)}
.ib svg{width:26px;height:26px}
.ib.liked{color:var(--acc)}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:#24304a;color:#9fb8ff;margin-left:6px;vertical-align:2px}
.more{display:block;margin:16px auto 0}
/* tiles */
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.tile{text-align:left;scroll-snap-align:start}
.tile .art{width:100%;height:auto;aspect-ratio:1;border-radius:14px;font-size:40px;margin-bottom:8px}
.tile.round .art{border-radius:50%}
.tile b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.genre{height:84px;border-radius:14px;padding:14px;font-weight:800;font-size:18px;text-align:left;display:flex;align-items:flex-end;color:#fff}
/* hero */
.hero{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap}
.hero .art{width:180px;height:180px;border-radius:18px;font-size:60px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.hero.round .art{border-radius:50%}
.kick{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.seg{display:flex;gap:8px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
/* now playing (panel + sheet) */
.npt{font-size:20px;font-weight:800;margin:16px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npa{color:var(--ink2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--line) var(--p,0%));outline:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--ink)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:8px 0 6px}
.cb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);position:relative}
.cb svg{width:28px;height:28px}
.cb:hover{color:var(--ink)}
.cb.on{color:var(--acc)}
.cb.on:after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.cb.play{width:72px;height:72px;background:var(--ink);color:var(--bg)}
.cb.play svg{width:34px;height:34px}
.cb .one{position:absolute;font-size:10px;font-weight:800;top:9px;right:9px}
.acts{display:flex;justify-content:center;gap:10px;margin:6px 0 14px}
.acts .btn{min-height:44px;padding:0 16px;font-size:15px}
.note{font-size:13px;color:var(--ink3);text-align:center;margin:6px 0}
.upnext h4{margin:18px 0 6px;font-size:15px;color:var(--ink2)}
.upnext .song{min-height:60px}
.upnext .art{width:44px;height:44px}
.sheet{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#1d1424,#0b0b10 55%);transform:translateY(100%);transition:transform .25s ease;overflow:auto;padding:calc(10px + var(--sa-t)) 20px calc(24px + var(--sa-b))}
.sheet.open{transform:none}
.sheet .grab{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet .slot{max-width:520px;margin:0 auto}
.sheet .wrap{max-width:520px;margin:0 auto}
/* menus/modals/toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.menu{background:var(--panel2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:10px 10px calc(14px + var(--sa-b));max-height:80vh;overflow:auto}
@media (min-width:900px){.scrim{align-items:center}.menu{border-radius:20px}}
.menu .mh{display:flex;align-items:center;gap:12px;padding:8px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh .art{width:48px;height:48px}
.menu .mh b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mh span{color:var(--ink2);font-size:14px}
.menu button.it{display:flex;width:100%;align-items:center;gap:14px;padding:14px 12px;border-radius:12px;text-align:left;font-size:16px;font-weight:600}
.menu button.it:hover{background:var(--hover)}
.menu button.it svg{width:24px;height:24px;color:var(--ink2)}
.menu .lbl{padding:12px 12px 4px;font-size:13px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:calc(100% - 32px);max-width:420px;margin:auto}
.modal h3{margin:0 0 14px;font-size:20px}
.modal input{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 14px;font-size:17px;outline:none;margin-bottom:14px}
.modal input:focus{border-color:var(--acc)}
.modal .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(var(--mini) + var(--tabs) + var(--sa-b) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center;font-size:15px}
.toast.show{opacity:1}
@media (min-width:900px){.toast{bottom:28px}}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.scan{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;margin-top:12px}.scan i{display:block;height:100%;width:0;background:var(--acc)}
/* ---------- phone ---------- */
@media (max-width:899px){
  .app{grid-template-columns:1fr;padding-bottom:calc(var(--mini) + var(--tabs) + var(--sa-b))}
  .side,.np-panel{display:none}
  .view{padding:calc(18px + var(--sa-t)) 16px 30px}
  h1{font-size:28px}
  .hero .art{width:132px;height:132px}
  .song .num{display:none}
  .shelf{grid-auto-columns:138px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + var(--sa-b));padding-bottom:var(--sa-b);background:#07070b;border-top:1px solid var(--line);z-index:30}
  .tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:650;color:var(--ink3);text-decoration:none}
  .tabs a svg{width:26px;height:26px}
  .tabs a.on{color:var(--ink)}
  .tabs a.on svg{color:var(--acc)}
  .mini{display:flex;position:fixed;left:8px;right:8px;bottom:calc(var(--tabs) + var(--sa-b) + 6px);height:calc(var(--mini) - 10px);background:#2a1f2e;border-radius:14px;align-items:center;gap:10px;padding:0 6px 0 8px;z-index:31;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .mini .art{width:50px;height:50px;border-radius:8px}
  .mini .slot-mini{width:89px;height:50px;border-radius:8px;flex:none;background:#000}
  .mini .txt{flex:1;min-width:0}
  .mini .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .a{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .cb{width:46px;height:46px}
  .mini .prog{position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  .mini .prog i{display:block;height:100%;background:var(--ink);width:0}
}
</style>
</head>
<body>

  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="view" id="view"></div></main>
  <aside class="np-panel" id="npPanel"><div class="inner" id="npDesk"></div></aside>
</div>
<div class="mini" id="mini"></div>
<nav class="tabs" id="tabs"></nav>
<section class="sheet" id="sheet" aria-label="Now playing"></section>
<div id="ytWrap"><div id="ytPlayer"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="pickFolder" webkitdirectory multiple class="hide">
<input type="file" id="pickFiles" accept="audio/*,.mp3,.m4a,.flac,.ogg,.opus,.wav,.aac" multiple class="hide">
<input type="file" id="pickBackup" accept=".json,application/json" class="hide">
<audio id="audio" preload="auto" playsinline></audio>

/* ---------- backup ---------- */
function backup() {
  const data = JSON.stringify({ app: 'tunebox', v: 2, at: new Date().toISOString(), favs: D.favs, pls: D.pls, hist: D.hist, seen: D.seen, prefs: D.prefs });
  const a = h('a', { href: URL.createObjectURL(new Blob([data], { type: 'application/json' })), download: `tunebox-backup-${new Date().toISOString().slice(0, 10)}.json` }); document.body.append(a); a.click(); a.remove(); toast('Backup saved to your downloads');
}
$('#pickBackup').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const j = JSON.parse(await f.text()); if (j.app !== 'tunebox') throw new Error('not a Tunebox backup');
    Object.assign(D.favs, j.favs || {}); Object.assign(D.pls, j.pls || {});
    if (j.hist) { const ks = new Set(D.hist.plays.map(p => p.key + p.at)); D.hist.plays = D.hist.plays.concat((j.hist.plays || []).filter(p => !ks.has(p.key + p.at))).sort((a, b) => b.at - a.at).slice(0, 400); for (const [k, n] of Object.entries(j.hist.counts || {})) D.hist.counts[k] = Math.max(D.hist.counts[k] || 0, n); for (const [k, n] of Object.entries(j.hist.skips || {})) D.hist.skips[k] = Math.max(D.hist.skips[k] || 0, n); }
